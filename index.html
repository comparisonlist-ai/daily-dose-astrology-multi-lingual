<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astroseek - Daily Horoscope</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#d97706">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 {
      color: #1e293b;
      font-size: 22px;
      margin: 0;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }
    .search-box input {
      padding: 10px;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      flex-grow: 1;
    }
    #result-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 15px;
    }
    .rashi-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 15px;
    }
    .rashi-card h3 {
      color: #d97706;
      margin-top: 0;
      font-size: 18px;
    }
    .rashi-card p {
      margin: 6px 0;
      color: #475569;
      font-size: 13px;
      line-height: 1.4;
    }
    .loading {
      grid-column: 1 / -1;
      text-align: center;
      color: #64748b;
      padding: 30px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-row">
      <h1>Astroseek Horoscope</h1>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search Rashi (e.g. Aries, Mesh)..." onkeyup="filterHoroscope()">
    </div>

    <div id="result-container">
      <div class="loading">Loading horoscope data...</div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://daily-rashifal-app.comparisonlist.workers.dev";
    let allData = [];

    async function loadData() {
      try {
        const response = await fetch(WORKER_URL, {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        });
        
        if (!response.ok) {
          throw new Error(`Server returned status ${response.status}`);
        }

        const result = await response.json();
        
        // Handles Graha API standard structures alongside existing Worker outputs
        if (Array.isArray(result)) {
          allData = result;
        } else if (result.response && Array.isArray(result.response)) {
          allData = result.response;
        } else if (result.data && Array.isArray(result.data)) {
          allData = result.data;
        } else if (result.data && Array.isArray(result.data.rashifal)) {
          allData = result.data.rashifal;
        } else if (result.rashifal && Array.isArray(result.rashifal)) {
          allData = result.rashifal;
        } else {
          throw new Error("Invalid data format received from endpoint");
        }

        if (allData.length > 0) {
          renderCards(allData);
        } else {
          document.getElementById("result-container").innerHTML = "<div class='loading'>No horoscope records found.</div>";
        }
      } catch (err) {
        console.error("Fetch error:", err);
        document.getElementById("result-container").innerHTML = "<div class='loading'>Unable to load predictions right now. Please check your connection.</div>";
      }
    }

    function renderCards(dataList) {
      let html = "";
      dataList.forEach(item => {
        // Safe mapping across Graha API keys and fallback properties
        const rashiEn = item.sign || item.rashi_en || item.name || 'Zodiac';
        const rashiHi = item.rashi_hi || item.local_name || item.hindi_name || '';
        const overall = item.prediction || item.predictions_hi?.overall || item.overall || item.description || 'Details unavailable.';
        const career = item.career || item.predictions_hi?.career || '';
        const luckyNum = item.lucky_number || item.lucky?.number || 'N/A';
        const luckyColor = item.lucky_color || item.lucky?.color || '';

        html += `
          <div class="rashi-card">
            <h3>${rashiEn} ${rashiHi ? `(${rashiHi})` : ''}</h3>
            <p><strong>Prediction:</strong> ${overall}</p>
            ${career ? `<p><strong>Career:</strong> ${career}</p>` : ''}
            <p><strong>Lucky Number:</strong> ${luckyNum}</p>
            ${luckyColor ? `<p><strong>Lucky Color:</strong> ${luckyColor}</p>` : ''}
          </div>
        `;
      });
      document.getElementById("result-container").innerHTML = html;
    }

    function filterHoroscope() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      if (!query) {
        renderCards(allData);
        return;
      }
      const filtered = allData.filter(item => {
        const en = (item.sign || item.rashi_en || item.name || '').toLowerCase();
        const hi = (item.rashi_hi || item.local_name || item.hindi_name || '').toLowerCase();
        return en.includes(query) || hi.includes(query);
      });
      renderCards(filtered);
    }

    // Load data on page launch
    loadData();

    // Register Service Worker matching your repository file structure
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.service.worker.js')
        .then(() => console.log('Service worker registered successfully'))
        .catch(err => console.log('Service worker registration failed:', err));
    }
  </script>

<div id="horoscope-container">
  <p>Loading horoscopes...</p>
</div>

<script src="/script.js"></script>
  
</body>
</html>
