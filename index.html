<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astroseek - Daily Horoscope</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#d97706">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 {
      color: #1e293b;
      font-size: 22px;
      margin: 0;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }
    .search-box input {
      padding: 10px;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      flex-grow: 1;
    }
    #result-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }
    .rashi-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
    }
    .rashi-card h3 {
      color: #d97706;
      margin-top: 0;
      font-size: 18px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 8px;
    }
    .rashi-card p {
      margin: 8px 0;
      color: #475569;
      font-size: 13px;
      line-height: 1.4;
    }
    .loading {
      grid-column: 1 / -1;
      text-align: center;
      color: #64748b;
      padding: 30px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-row">
      <h1>Astroseek Horoscope</h1>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search Rashi (e.g. Aries, Mesh)..." onkeyup="filterHoroscope()">
    </div>

    <div id="result-container">
      <div class="loading">Loading horoscope data...</div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://daily-rashifal-app.comparisonlist.workers.dev";
    let allData = [];

    async function loadData() {
      try {
        const response = await fetch(WORKER_URL, {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        });
        
        if (!response.ok) {
          throw new Error(`Server returned status ${response.status}`);
        }

        const result = await response.json();
        
        if (Array.isArray(result)) {
          allData = result;
        } else if (result.data && Array.isArray(result.data.rashifal)) {
          allData = result.data.rashifal;
        } else if (result.data && Array.isArray(result.data)) {
          allData = result.data;
        } else {
          throw new Error("Invalid data format received from endpoint");
        }

        if (allData.length > 0) {
          renderCards(allData);
        } else {
          document.getElementById("result-container").innerHTML = "<div class='loading'>No horoscope records found.</div>";
        }
      } catch (err) {
        console.error("Fetch error:", err);
        document.getElementById("result-container").innerHTML = "<div class='loading'>Unable to load predictions right now. Please check your connection.</div>";
      }
    }

    function renderCards(dataList) {
      let html = "";
      dataList.forEach(item => {
        const rashiEn = item.rashi_en || item.sign || 'Zodiac';
        const rashiHi = item.rashi_hi || '';
        const symbol = item.symbol || '';
        const lord = item.rashi_lord || '';
        const day = item.day || '';
        const color = item.colors || '';
        const mantra = item.mantra || '';
        
        const enOverall = item.predictions_en?.overall || 'Details unavailable.';
        const hiOverall = item.predictions_hi?.overall || '';

        html += `
          <div class="rashi-card">
            <h3>${rashiEn} (${rashiHi}) ${symbol ? `- ${symbol}` : ''}</h3>
            <p><strong>Lord:</strong> ${lord} | <strong>Day:</strong> ${day}</p>
            <p><strong>Color:</strong> ${color}</p>
            <p><strong>Mantra:</strong> ${mantra}</p>
            <hr style="border:0; border-top:1px solid #e2e8f0; margin:12px 0;">
            <p><strong>English:</strong> ${enOverall}</p>
            ${hiOverall ? `<p><strong>Hindi:</strong> ${hiOverall}</p>` : ''}
          </div>
        `;
      });
      document.getElementById("result-container").innerHTML = html;
    }

    function filterHoroscope() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      if (!query) {
        renderCards(allData);
        return;
      }
      const filtered = allData.filter(item => {
        const en = (item.rashi_en || item.sign || '').toLowerCase();
        const hi = (item.rashi_hi || '').toLowerCase();
        return en.includes(query) || hi.includes(query);
      });
      renderCards(filtered);
    }

    loadData();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.service.worker.js')
        .then(() => console.log('Service worker registered successfully'))
        .catch(err => console.log('Service worker registration failed:', err));
    }
  </script>

  <script src="/script.js"></script>

</body>
</html>
