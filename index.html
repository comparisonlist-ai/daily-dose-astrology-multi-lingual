<html lang="hi">
<head>

  >

  <meta name="theme-color" content="#0b1026">

  <style>
    :root {
      color-scheme: dark;
      --background: #0b1026;
      --panel: #141c38;
      --panel-light: #1b2546;
      --gold: #d4af37;
      --text: #f5f5f5;
      --muted: #c1c8dc;
      --border: #34405e;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, "Noto Sans",
        "Noto Sans Devanagari", sans-serif;
      line-height: 1.65;
    }

    button,
    select {
      font: inherit;
    }

    .header {
      padding: 24px 16px;
      text-align: center;
      background: #101832;
      border-bottom: 1px solid var(--border);
    }

    .header p {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 1.2rem;
      font-weight: 700;
    }

    .site-logo {
      display: block;
      width: 88px;
      height: 88px;
      object-fit: contain;
      margin: 12px auto;
      border-radius: 18px;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2.1rem);
      line-height: 1.3;
    }

    .language-area {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .language-area label {
      color: var(--muted);
    }

    #languageSelect {
      max-width: 100%;
      padding: 9px 12px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--gold);
      border-radius: 8px;
    }

    .container {
      width: min(100% - 28px, 1000px);
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .today-date {
      margin: 0 0 22px;
      color: var(--muted);
      text-align: center;
    }

    .section-title {
      margin: 0 0 16px;
      color: var(--gold);
      text-align: center;
      font-size: 1.35rem;
    }

    .rashi-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .rashi-card {
      min-width: 0;
      min-height: 108px;
      padding: 14px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .rashi-card:hover,
    .rashi-card:focus-visible {
      border-color: var(--gold);
      outline: none;
    }

    .rashi-card.selected {
      background: var(--panel-light);
      border: 2px solid var(--gold);
    }

    .rashi-card span {
      font-size: 1.6rem;
    }

    .rashi-card strong {
      font-size: 1rem;
      overflow-wrap: anywhere;
    }

    .rashi-card small {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .prediction {
      margin-top: 30px;
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      scroll-margin-top: 16px;
    }

    .hidden {
      display: none !important;
    }

    .prediction > h2 {
      margin: 0 0 20px;
      color: var(--gold);
      text-align: center;
      font-size: 1.45rem;
    }

    .prediction-item {
      margin: 12px 0;
      padding: 14px;
      background: var(--panel-light);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .prediction-item h3 {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 1.05rem;
    }

    .prediction-item p {
      margin: 0;
      overflow-wrap: anywhere;
    }

    footer {
  padding: 20px 14px;
  text-align: center;
  color: var(--muted);
  border-top: 1px solid var(--border);
}

footer p {
  margin: 0;
}

.footer-links {
  margin: 0 0 12px;
  line-height: 2;
}

.footer-links a {
  color: var(--gold);
  text-decoration: none;
  margin: 0 5px;
}

.footer-links a:hover {
  text-decoration: underline;
}

    #install-banner {
      display: none;
      width: min(100% - 24px, 680px);
      margin: 18px auto;
      padding: 16px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--gold);
      border-radius: 12px;
    }

    #install-banner h2 {
      margin: 0 0 6px;
      color: var(--gold);
      font-size: 1.15rem;
    }

    #install-help {
      margin: 6px 0 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    #install-btn {
      padding: 10px 20px;
      color: #101010;
      background: var(--gold);
      border: 0;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    #install-btn:focus-visible {
      outline: 2px solid white;
      outline-offset: 3px;
    }

    @media (max-width: 360px) {
      .container {
        width: calc(100% - 18px);
      }

      .rashi-grid {
        gap: 7px;
      }

      .rashi-card {
        min-height: 100px;
        padding: 10px 3px;
      }

      .rashi-card strong {
        font-size: 0.9rem;
      }

      .prediction {
        padding: 12px;
      }
    }

    @media (min-width: 650px) {
      .rashi-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .prediction {
        padding: 26px;
      }
    }


.install-prompt {
  margin: -10px 0 22px;
  text-align: center;
  color: var(--muted);
  font-size: 0.95rem;
}

.install-prompt a {
  color: var(--gold);
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 3px;
}

    
  </style>
</head>
