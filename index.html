<script>
(function () {
  let deferredPrompt;

  const banner = document.getElementById('install-banner');
  const installBtn = document.getElementById('install-btn');
  const help = document.getElementById('install-help');

  if (!banner || !installBtn) return;

  // Do not show the banner if already running as an installed app.
  const isInstalled =
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  if (isInstalled) return;

  // Show the banner when the browser offers its install prompt.
  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    deferredPrompt = event;
    banner.style.display = 'block';
  });

  
installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) {
    help.textContent =
      'To install AstroSeek, open Chrome menu ⋮ and select Install app.';
    return;
  }

  deferredPrompt.prompt();

  const result = await deferredPrompt.userChoice;

  if (result.outcome === 'accepted') {
    banner.style.display = 'none';
  }

  deferredPrompt = null;
});


  window.addEventListener('appinstalled', () => {
    banner.style.display = 'none';
    deferredPrompt = null;
  });
})();
</script>
