name: daily


on:
  schedule:
    - cron: '35 18 * * *'
  workflow_dispatch:

permissions: { contents: write }
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i astronomy-engine && node generate.mjs
      - name: Fresh text from Gemini
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-4-hydrogen
        run: python3 generate_rashifal.py
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add today.json && git commit -m "daily rashifal" || exit 0
          git push
