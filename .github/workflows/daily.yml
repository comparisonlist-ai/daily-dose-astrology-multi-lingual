name: daily
on:
  schedule: [{ cron: '30 0 * * *' }]  # 6:00 AM IST
  workflow_dispatch:
permissions: { contents: write }
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i astronomy-engine && node generate.mjs
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add today.json && git commit -m "daily rashifal" || exit 0
          git push
